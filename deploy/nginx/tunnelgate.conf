# =============================================================================
# TunnelGate - panel + console vhosts (nginx)
#
# Install:  install -m 0644 deploy/nginx/tunnelgate.conf /etc/nginx/sites-available/
#           ln -s /etc/nginx/sites-available/tunnelgate.conf /etc/nginx/sites-enabled/
#           rm -f /etc/nginx/sites-enabled/default
#           nginx -t && systemctl reload nginx
#
# This file assumes a wildcard certificate (*.<host_suffix>) covering
# panel.<suffix>, console.<suffix> and every router vhost. Build it with the
# DNS-01 challenge (docs/INSTALL_SERVER.md section 6); HTTP-01 cannot issue
# wildcards.
# =============================================================================

# WebSocket upgrade helper for the panel and console vhosts.
# NOTE: the generated routes.conf declares its own $tg_connection_upgrade with the
# same value. nginx allows only one map per target variable, so the two files must
# never both define $connection_upgrade - they don't.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Router vhosts: one server block per router, rewritten by the panel
# (app/services/proxy.py) whenever a router, its port or its status changes, then
# reloaded. The installer seeds this file empty so nginx -t passes before the
# first router exists.
include /etc/nginx/tunnelgate/routes.conf;

# -----------------------------------------------------------------------------
# Panel: the SPA and the API
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Firmware images go to LuCI, not here, but inventory imports arrive at the
    # panel; 64m is generous and still bounded.
    client_max_body_size 64m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # script-src 'self': Vite emits hashed external bundles, never inline script.
    # style-src needs 'unsafe-inline' because xterm.js and the SPA set style attributes.
    # connect-src must list the console host: the terminal opens wss://console.<suffix>.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://console.panel.example.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/wasm image/svg+xml;

    # Vite fingerprints asset names, so a changed file is a changed URL: cache forever.
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # The FastAPI app serves both the API and the SPA (index.html fallback), so there
    # is one source of truth for routing and no second document root to keep in sync.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The gate subrequest belongs to nginx: router vhosts call it on the upstream
    # directly (proxy_pass 127.0.0.1:8080/__tg/auth), so nothing public needs it and
    # an anonymous visitor must not be able to probe it.
    location /__tg/ {
        return 404;
    }

    access_log /var/log/nginx/tunnelgate-panel.access.log;
    error_log  /var/log/nginx/tunnelgate-panel.error.log warn;
}
# -----------------------------------------------------------------------------
# Console: the interactive web terminal
#
# WHY ONE HOSTNAME AND NOT ONE PER ROUTER
# The terminal is a WebSocket. nginx cannot run auth_request on an upgraded
# connection: the subrequest would be issued before the upgrade and the 101
# response has nowhere to carry the injected identity header. The session is
# therefore authorised by a single-use, short-lived ticket minted by
# POST /api/v1/routers/<id>/console/start; the router id rides inside the ticket,
# not in the Host header. Keeping /__tg/auth as the ONLY place that binds a panel
# session to a router id is exactly why the console gets its own host and no
# per-router vhost.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://console.panel.example.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # The terminal socket itself.
    # proxy_read_timeout must outlive an idle shell. The application enforces the
    # real limit (console_idle_timeout_seconds, 900 s by default) and closes the
    # socket itself; 3600 s here only stops nginx from cutting a quiet session first
    # and turning it into a "connection lost" that looks like a panel bug.
    location /api/v1/routers/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # A terminal must never be buffered: partial lines and prompts would vanish.
        proxy_buffering         off;
        proxy_request_buffering off;
        tcp_nodelay on;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /__tg/ {
        return 404;
    }

    access_log /var/log/nginx/tunnelgate-console.access.log;
    error_log  /var/log/nginx/tunnelgate-console.error.log warn;
}

# -----------------------------------------------------------------------------
# Port 80: ACME plus the permanent redirect
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com console.panel.example.com *.panel.example.com;

    # Keep the ACME path on plain HTTP: a certbot webroot renewal behind the
    # redirect would fail. DNS-01 does not need it, but the second path is free.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
