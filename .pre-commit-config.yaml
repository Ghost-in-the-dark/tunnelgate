# Install with: .venv/bin/pip install pre-commit && pre-commit install
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^web/(package-lock\.json|tsconfig.*\.json)$
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^(app|tests)/.*\.py$
      - id: ruff-format
        files: ^(app|tests)/.*\.py$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["-s", "sh", "-e", "SC1091,SC3043,SC2039"]
        files: ^agent/.*\.sh$
      - id: shellcheck
        args: ["-s", "bash", "-e", "SC1091"]
        files: ^(scripts|deploy)/.*\.sh$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^web/src/.*\.(ts|tsx|css)$
        args: ["--single-quote", "--print-width", "100"]

  - repo: local
    hooks:
      - id: python-import-smoke
        name: app imports cleanly
        entry: python -c "import sys; sys.path.insert(0, '.'); from app.main import app"
        language: system
        pass_filenames: false
        files: ^app/.*\.py$

      - id: no-private-keys
        name: no private key material committed
        entry: |
          bash -c 'pat="BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY"; if grep -rIlE "$pat" --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules .; then
            echo "PRIVATE KEY material found in the files above; refusing to commit" >&2; exit 1; fi'
        language: system
        pass_filenames: false
