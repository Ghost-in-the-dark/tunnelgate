# =============================================================================
# TunnelGate behind an EXTERNAL reverse proxy - plain HTTP, ONE public name
#
# Installed by scripts/quick-install.sh. This is NOT the TLS vhost
# (deploy/nginx/tunnelgate.conf) and the two must never be installed together:
# both declare "map $http_upgrade $connection_upgrade", and nginx permits only
# one map per target variable.
#
# The deployment this file describes:
#
#     browser    https://<public-name>
#        |            (TLS terminates HERE, on your edge: certificates, DNS and
#        v             the ACME client are yours, on your own machine)
#     your proxy
#        |            http://<this host>:80
#        v
#     this nginx -> 127.0.0.1:8080 (the panel: SPA + API + console WebSocket)
#
# WHY HTTP ON THIS SIDE
#   The panel is not reachable from the internet directly: only this vhost is,
#   and only from your proxy. TLS being terminated one hop earlier is a normal
#   shape (it is how every CDN and every dockerised ingress works), and it keeps
#   certificate renewal out of a host that has no DNS credentials. What this file
#   has to get right is the part the panel cannot verify on its own: that the
#   request arriving here still identifies the REAL client and the REAL scheme.
#
# WHY THE INCLUDE IS INSIDE THE SERVER BLOCK
#   One public name means TUNNELGATE_ROUTE_MODE=path with the MERGED layout:
#   every router is https://<public-name>/<slug>/ on the panel's own host, so
#   routes.conf holds LOCATIONS ONLY (no server{} block, no map). Moving this
#   include up to the http context makes nginx reject the whole config with
#   "location directive is not allowed here" and every router stops resolving.
#   "python -m app.cli doctor" re-checks the include context under
#   "routes include".
#
#   What the merged layout costs is in docs/SECURITY.md 6.1: a path is not an
#   origin boundary, so a compromised router page shares this origin with the
#   panel. It is the price of a single name with no wildcard certificate.
# =============================================================================

# WebSocket upgrade helper. Needed by the console terminal (same host here) and
# by the generated router locations in routes.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The scheme the BROWSER used, as reported by your proxy.
#   * your proxy sets X-Forwarded-Proto  -> that value is used
#   * it does not                        -> this hop's own scheme (http)
# The panel only believes this from a trusted peer (TUNNELGATE_TRUSTED_PROXIES,
# 127.0.0.1 by default, i.e. this nginx). It is what makes the session cookie
# Secure and the redirects absolute when TLS terminates upstream.
map $http_x_forwarded_proto $tg_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    # scripts/quick-install.sh rewrites this line when --port is not 80.
    listen 80 default_server;
    listen [::]:80 default_server;

    # Catch-all on purpose: your proxy may forward any Host, and this host has no
    # other vhost. A named vhost would answer 404 whenever the proxy normalises
    # the name (trailing dot, port, IDN form).
    server_name _;

    # Firmware images go to LuCI, not here, but inventory imports arrive at the
    # panel; 64m is generous and still bounded.
    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # No Strict-Transport-Security here: this vhost speaks plain HTTP, where the
    # header is ignored anyway. HSTS belongs on your edge, next to the cert.
    #
    # script-src 'self': Vite emits hashed external bundles, never inline script.
    # style-src needs 'unsafe-inline' because xterm.js and the SPA set style
    # attributes. connect-src names the console WebSocket explicitly: the terminal
    # opens wss://<public-name>/api/v1/... , and 'self' alone is not reliably
    # treated as covering the wss: scheme in every browser.
    # scripts/quick-install.sh rewrites panel.example.com to --host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://panel.example.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/wasm image/svg+xml;

    # ---- routers (generated) ------------------------------------------------
    # PATH routing mode: rewritten by app/services/proxy.py whenever the router or
    # port set changes, and reloaded by tunnelgate-nginx-reload.path, which
    # validates with nginx -t before signalling this master.
    #
    # In the MERGED layout (routers on this name) this include stays, and the file
    # holds locations only. In the SEPARATE layout (routers on a gateway name of
    # their own) scripts/quick-install.sh replaces this line with a comment and the
    # gateway vhost includes the file instead: router prefixes must not exist on the
    # panel's origin, or the origin boundary the second name buys is gone again.
    include /etc/nginx/tunnelgate/routes.conf;

    # ---- panel --------------------------------------------------------------
    # Vite fingerprints asset names, so a changed file is a changed URL: cache
    # forever.
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tg_forwarded_proto;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # The FastAPI app serves both the API and the SPA (index.html fallback), so
    # there is one source of truth for routing and no second document root to
    # keep in sync.
    #
    # This is also the console WebSocket (/api/v1/routers/<id>/console/ws): the
    # terminal's frames ride the same /api/ prefix, which is why the timeouts
    # here are an hour. A quiet shell must not be closed by a 60 s default.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tg_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tg_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # The browser-facing half of the router launch hand-off. It must be reachable
    # on the PUBLIC name, because that is the only origin where the browser holds
    # the panel session cookie; it answers with a 303 into /<slug>/__tg/enter.
    location = /__tg/launch {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tg_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # The gate subrequest is internal to nginx: router locations call it on the
    # upstream directly, so nothing public needs it and an anonymous visitor must
    # not be able to probe it. The exact-match "/__tg/auth" that routes.conf
    # declares inside this same block wins over this prefix, which is intended.
    location /__tg/ {
        return 404;
    }

    access_log /var/log/nginx/tunnelgate.access.log;
    error_log  /var/log/nginx/tunnelgate.error.log warn;
}
