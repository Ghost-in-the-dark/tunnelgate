# =============================================================================
# TunnelGate - sshd drop-in for the tunnel user
#
# Install:  install -m 0644 deploy/sshd/tunnelgate.conf /etc/ssh/sshd_config.d/
#           sshd -t && systemctl reload ssh
#
# NOTE: /etc/ssh/sshd_config must start with "Include /etc/ssh/sshd_config.d/*.conf".
# Debian and Ubuntu do this by default; verify with "sshd -T | grep -i forward".
#
# The Match block below is byte-identical to docs/SECURITY.md section 3. Keep it
# that way: that document explains the reasoning and this file is what gets
# installed, so a divergence means the deployed hardening is not the documented one.
#
# What the tunnel account may do, and why:
#   AllowTcpForwarding remote - the device runs "ssh -R port:127.0.0.1:80", so remote
#                               forwarding is the whole point. "local" is refused, so
#                               the account cannot be used as a jump host outbound.
#   PermitOpen none           - local forwarding refused even if AllowTcpForwarding
#                               is ever loosened.
#   GatewayPorts no           - sshd binds the reverse listener on 127.0.0.1 only. That
#                               is why tunnel ports need no firewall rule and why the
#                               generated nginx vhost proxies to 127.0.0.1:<port>.
#   PermitTTY no + ForceCommand /bin/false - no interactive shell even if a device key
#                               leaks: the key can forward, nothing else.
#   PasswordAuthentication no - key-only; the device key is the identity.
#
# Do NOT add "restrict" to the authorized_keys line instead of these options: on
# current OpenSSH "restrict" implies permitlisten="none", which silently makes every
# reverse tunnel fail. app/security.py spells the options out for that reason.
# =============================================================================

Match User tunnelgate
    PasswordAuthentication no
    PubkeyAuthentication yes
    AuthenticationMethods publickey
    AllowAgentForwarding no
    AllowTcpForwarding remote      # no local forwarding at all
    PermitOpen none                # -L is refused
    GatewayPorts no                # listeners stay on loopback
    PermitTTY no
    X11Forwarding no
    PermitUserRC no
    ForceCommand /bin/false
    AllowUsers tunnelgate
