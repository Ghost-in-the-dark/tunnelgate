# =============================================================================
# TunnelGate GATEWAY vhost for an EXTERNAL reverse proxy - plain HTTP, SECOND
# name
#
# Installed by scripts/quick-install.sh when the operator passes --gateway-host.
# It serves the routers' LuCI on their own name, while the panel keeps its own:
#
#     browser    https://panel.example.com      (the panel: SPA, API, console)
#     browser    https://gateway.example.com/<slug>/   (the routers)
#        |            TLS terminates on YOUR edge, one certificate covering BOTH
#        v            names - no wildcard, because the names are fixed
#     your proxy
#        |            http://<this host>:80       (one listener, both names)
#        v
#     this nginx -> panel.example.com  -> the panel vhost (tunnelgate.conf)
#                -> gateway.example.com -> this file -> the routers
#
# WHY A SECOND NAME AT ALL
#   A path prefix is not an origin boundary. When routers are published on the
#   panel's own name (the MERGED layout), a hostile or compromised router page
#   runs JavaScript in the panel's origin: it can read the CSRF cookie and call
#   the panel API as the signed-in operator, and it can read every other
#   router's LuCI through the same origin. Giving the routers their own name
#   removes that: the browser treats the gateway as a separate origin, and the
#   panel's cookie is never sent here. It costs one extra DNS record and one
#   extra name on a certificate you already need - not a wildcard.
#
# WHY THE INCLUDE IS INSIDE THIS SERVER BLOCK
#   routes.conf holds LOCATIONS ONLY in this deployment (app/services/proxy.py
#   regenerates it whenever the router set changes). All locations are
#   server-context directives: moving this include up to the http context makes
#   nginx reject the whole config with "location directive is not allowed
#   here" and every router stops resolving. "python -m app.cli doctor"
#   re-checks this under "routes include".
#
#   Do NOT also include routes.conf from the panel vhost. It would parse and it
#   would work, which is why it is worth stating: the router prefixes would then
#   exist on the panel's origin as well, and the origin sharing this file exists
#   to remove would be back with nothing to show for it.
#
# WHY THERE IS NO "map" HERE
#   The router locations in routes.conf use $connection_upgrade, which the panel
#   vhost (deploy/nginx/tunnelgate-behind-proxy.conf) declares once in the http
#   context. A map is illegal inside a server block and nginx allows only one
#   map per target variable, so a second declaration here would either be
#   rejected or silently win. Reuse that name; do not redeclare it.
# =============================================================================

server {
    # scripts/quick-install.sh rewrites these lines when --port is not 80. They
    # deliberately lack default_server: the panel vhost owns the default, and
    # two default_server blocks on one address:port make nginx refuse the config.
    listen 80;
    listen [::]:80;

    # scripts/quick-install.sh rewrites gateway.example.com to --gateway-host.
    server_name gateway.example.com;

    # LuCI firmware uploads are large; the 1m default would answer 413.
    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # No Strict-Transport-Security here: this vhost speaks plain HTTP, where the
    # header is ignored anyway. HSTS belongs on your edge, next to the cert.

    # ---- routers (generated) ------------------------------------------------
    # Locations only: rewritten by app/services/proxy.py whenever the router or
    # port set changes. The reload is performed by tunnelgate-nginx-reload.path,
    # which validates with nginx -t before signalling the master.
    include /etc/nginx/tunnelgate/routes.conf;

    # This host belongs to no single router: / is the panel's job and it lives on
    # its own name. Answering 404 keeps the two names' content disjoint - a router
    # page reached through this origin is not the panel, and the panel is not
    # reachable through this origin at all.
    location / {
        return 404;
    }

    # The gate subrequest is internal to nginx: router locations call it on the
    # upstream directly, so nothing public needs it and an anonymous visitor must
    # not be able to probe it. The exact-match "/__tg/auth" that routes.conf
    # declares inside this same block wins over this prefix, which is intended.
    location /__tg/ {
        return 404;
    }

    access_log /var/log/nginx/tunnelgate-gateway.access.log;
    error_log  /var/log/nginx/tunnelgate-gateway.error.log warn;
}
